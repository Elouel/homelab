# chart: argo/argo-cd  (repo https://argoproj.github.io/argo-helm)
# global.domain (the UI hostname) is passed by bootstrap.sh from .env
global:
  domain: argocd.example.com

configs:
  params:
    # TLS is terminated at Traefik; argocd-server serves plain HTTP behind it
    server.insecure: true

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      # ClusterIssuer comes from platform/cluster-issuer (deployed by Argo CD itself).
      # Until it exists the certificate waits; cert-manager retries once the issuer is Ready.
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls: true   # Secret argocd-server-tls, filled by cert-manager
  # Metrics Services (*-metrics, port http-metrics) are scraped by ServiceMonitor argocd in platform/monitoring.
  # No serviceMonitor here: its CRD comes from platform/monitoring, which doesn't exist yet on a fresh cluster.
  metrics:
    enabled: true
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }

controller:
  metrics:
    enabled: true   # argocd_app_info: sync/health of every Application (alerts in platform/monitoring)
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

repoServer:
  metrics:
    enabled: true
  resources:
    requests: { cpu: 25m, memory: 128Mi }
    limits: { memory: 512Mi }

applicationSet:
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 256Mi }

redis:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

# Not needed on a single-user homelab: no SSO (dex), no notifications controller
dex:
  enabled: false
notifications:
  enabled: false
