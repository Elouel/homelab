{{- $host := .Values.host | default (printf "git.%s" .Values.domain) }}
# Forgejo web UI, API and Git over HTTPS at https://git.<domain>.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgejo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: forgejo-tls
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.forgejo.fullnameOverride }}-http
                port:
                  number: 3000
