# Secrets from Vault (kv/apps/forgejo/*), see the list at the top of values.yaml.
# First admin account: keys username and password, read by the chart's configure-gitea init container.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: forgejo-admin
  dataFrom:
    - extract:
        key: apps/forgejo/admin
---
# Shared runner secret: mounted by the register-runner sidecar (Forgejo side) and the runner pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: forgejo-runner-token
  data:
    - secretKey: token
      remoteRef:
        key: apps/forgejo/runner
        property: token
