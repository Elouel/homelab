# One Argo CD Application per folder under platform/ (cluster-wide config such as ClusterIssuers).
# Applied by bootstrap.sh with ${GIT_REPO_URL} / ${GIT_BRANCH} filled from .env.
# Folders are plain manifests or Helm charts (auto-detected) and get no cluster values.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: ${GIT_REPO_URL}
        revision: ${GIT_BRANCH}
        directories:
          - path: platform/*
  template:
    metadata:
      name: 'platform-{{.path.basename}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io   # removing the folder deletes its resources
    spec:
      project: default
      source:
        repoURL: ${GIT_REPO_URL}
        targetRevision: ${GIT_BRANCH}
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basename}}'   # only used by namespaced objects without a namespace
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff: { duration: 10s, factor: 2, maxDuration: 3m }
