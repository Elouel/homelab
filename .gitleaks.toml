# Secret scanning config for this repo (gitleaks: https://github.com/gitleaks/gitleaks)
# Used by the pre-commit hook (.githooks/pre-commit) and CI (.github/workflows/gitleaks.yml).
# Starts from gitleaks' ~200 built-in rules and adds homelab-specific ones below.

title = "homelab"

[extend]
useDefault = true

# --- Files that must never be committed, whatever is inside them -------------
# (.gitignore already excludes these; this catches `git add -f` and renames.)
[[rules]]
id = "forbidden-file"
description = "Secret-bearing file staged for commit (.env, keys, kubeconfig, .secrets/, exports)"
path = '''(?i)(^|/)(\.env|\.env\.(local|prod|production)|.*\.pem|.*\.key|.*\.p12|.*\.pfx|.*kubeconfig.*|.*_ed25519|.*_rsa|.*_ecdsa|id_[a-z0-9]+|k3s\.ya?ml|.*\.tar\.gz)$|(^|/)\.secrets/'''

# --- Public IPv4 addresses ----------------------------------------------------
# The server IP must stay in .env. Private/loopback/doc ranges are allowed.
[[rules]]
id = "public-ipv4"
description = "Public IPv4 address (keep server IPs in .env)"
regex = '''\b((?:25[0-5]|2[0-4]\d|1?\d?\d)\.(?:25[0-5]|2[0-4]\d|1?\d?\d)\.(?:25[0-5]|2[0-4]\d|1?\d?\d)\.(?:25[0-5]|2[0-4]\d|1?\d?\d))\b'''
secretGroup = 1
keywords = ["."]
  [[rules.allowlists]]
  regexTarget = "secret"
  regexes = [
    '''^0\.0\.0\.0$''',
    '''^127\.''',
    '''^10\.''',
    '''^192\.168\.''',
    '''^172\.(1[6-9]|2\d|3[01])\.''',
    '''^169\.254\.''',
    '''^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.''',   # CGNAT / Tailscale
    '''^192\.0\.2\.''', '''^198\.51\.100\.''', '''^203\.0\.113\.''',  # documentation
    '''^255\.''',
    '''^(1\.1\.1\.1|1\.0\.0\.1|8\.8\.8\.8|8\.8\.4\.4|9\.9\.9\.9)$''',  # public DNS
  ]

# --- sslip.io / nip.io hostnames embed the server IP --------------------------
[[rules]]
id = "ip-hostname"
description = "Hostname that embeds an IP address (sslip.io / nip.io)"
regex = '''(?i)\b(?:\d{1,3}[.-]){3}\d{1,3}\.(?:sslip\.io|nip\.io|xip\.io)\b'''
keywords = ["sslip.io", "nip.io", "xip.io"]

# --- k3s / Kubernetes ---------------------------------------------------------
[[rules]]
id = "k3s-token"
description = "k3s node/join token"
regex = '''\bK10[0-9a-f]{40,}::[a-z0-9]+:[a-zA-Z0-9]+\b'''
keywords = ["k10"]

[[rules]]
id = "kubeconfig-credential"
description = "Inline kubeconfig credentials"
regex = '''(?i)\b(client-key-data|client-certificate-data|token)\s*:\s*["']?([A-Za-z0-9+/=._-]{20,})'''
secretGroup = 2
keywords = ["client-key-data", "client-certificate-data", "token:"]

[[rules]]
id = "k8s-secret-data"
description = "Plain Kubernetes Secret with data/stringData (use Sealed Secrets/SOPS)"
regex = '''(?s)kind:\s*Secret\b.{0,400}?\n(data|stringData):\s*\n\s+\S+:\s*\S{6,}'''
keywords = ["kind: secret"]

# --- Passwords in shell/env/yaml ---------------------------------------------
[[rules]]
id = "password-assignment"
description = "Hard-coded password"
regex = '''(?i)\b[a-z_]*(?:password|passwd|pwd|secret|token)[a-z_]*\s*[:=]\s*["']?([^\s"'$#{}<>]{8,})'''
secretGroup = 1
entropy = 2.5
keywords = ["password", "passwd", "pwd", "secret", "token"]
  [[rules.allowlists]]
  regexTarget = "secret"
  regexes = [
    '''(?i)^(change-?me.*|changeme.*|example.*|placeholder.*|your[-_].*|xxx+|\*+|redacted|none|null|true|false)$''',
    '''^\$''',                # ${VAR} / $VAR references
  ]
  [[rules.allowlists]]
  regexTarget = "match"
  regexes = [
    '''(?i)\b(secretName|existingSecret|secretRef|secretKeyRef|tokenSecret\w*|passwordSecret\w*)\s*:''',  # references to Secrets, not values
  ]

# --- Global allowlist ---------------------------------------------------------
[[allowlists]]
description = "Known-safe files"
paths = [
  '''(^|/)\.gitleaks\.toml$''',
  '''(^|/)\.env\.example$''',     # placeholders only - reviewed
  '''(^|/)versions\.env$''',
]
