# Secrets from Vault (kv/<path>), see docs/secrets.md and docs/monitoring.md. Every key of the Vault secret
# becomes a key of the Kubernetes Secret. The pods that use them (Grafana, Alertmanager) wait until they exist.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: grafana-admin
  dataFrom:
    - extract:
        key: {{ .Values.vaultSecrets.grafana | quote }}     # admin-user, admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: alertmanager-telegram
  dataFrom:
    - extract:
        key: {{ .Values.vaultSecrets.telegram | quote }}    # bot-token, chat-id
