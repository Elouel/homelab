# One store for the whole cluster, but each namespace only reaches its own secrets: the store has no
# serviceAccountRef.namespace, so the operator logs in to Vault as ServiceAccount <vaultStore.serviceAccount> of the
# ExternalSecret's namespace ("referent" auth). The Vault policy (tools/vault-configure.sh) maps that login to
# kv/apps/<namespace>/* only.
# Sync wave 1: created after the operator and its webhook (wave 0) are healthy.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: {{ .Values.vaultStore.server | quote }}
      path: {{ .Values.vaultStore.kvPath | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ .Values.vaultStore.authMountPath | quote }}
          role: {{ .Values.vaultStore.role | quote }}
          serviceAccountRef:
            name: {{ .Values.vaultStore.serviceAccount | quote }}   # no namespace: the ExternalSecret's
            audiences: [{{ .Values.vaultStore.audience | quote }}]
